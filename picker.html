<!DOCTYPE html>
<!-- C6 拾取器窗（clip-picker.js 创建）：20 条 + ↑↓/Enter + 输入即过滤；失焦/Esc 关。
     主题=单一真相接入 app 体系：引 assets/tailwind.css（:root/:root.dark 变量族）+启动查
     theme:get 挂 html.dark（同 renderer apply 手法）；body transparent 透出 DWM 材质
     （窗口材质由主进程 setBackgroundMaterial(config.windowMaterial) 同单源设置）。
     原生 JS 零构建（不进 vite/esbuild 面——20 条列表不值得 React 栈）。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'" />
<title>剪贴板历史</title>
<link rel="stylesheet" href="assets/tailwind.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: transparent; }
  body { color: var(--text); font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; }
  #dragbar {
    height: 32px; /* 系统标题栏 overlay 占位（titleBarStyle hidden+overlay：拖拽/X 归系统，
                     此处仅留同高 spacer 防 overlay 压住搜索框；不需要 CSS drag） */
  }
  #search {
    width: 100%; padding: 8px 14px; border: none; border-bottom: 1px solid var(--border);
    background: var(--input); color: var(--text); font-size: 13px; outline: none;
  }
  #search::placeholder { color: var(--text-muted); }
  #list { height: calc(100% - 32px - 38px); overflow-y: auto; padding: 4px 0; }
  .entry {
    padding: 8px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 2px;
    border-left: 2px solid transparent;
  }
  .entry .main { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry .meta { font-size: 11px; color: var(--text-muted); }
  .entry.sel { background: var(--layer-hover); border-left-color: var(--primary); }
  .empty { padding: 24px 14px; color: var(--text-muted); text-align: center; }
</style>
</head>
<body>
<div id="dragbar"></div>
<input id="search" placeholder="过滤…（↑↓ 选择，Enter 取，Esc 关）" autofocus />
<div id="list"></div>
<script>
  const listEl = document.getElementById("list");
  const searchEl = document.getElementById("search");
  let entries = [];
  let filtered = [];
  let cursor = 0;
  let loading = true; // 拉取期间真加载态（防「暂无历史」误导——冷启动缓存空直拉窗口）

  // 主题跟随（app 单一真相：theme:get = nativeTheme.shouldUseDarkColors，同 renderer apply 手法；
  // picker 生命周期短（失焦即关），开窗查一次够）
  (async () => {
    try {
      const theme = await window.gotifyAPI?.getThemeState?.();
      document.documentElement.classList.toggle("dark", Boolean(theme?.dark));
    } catch {}
  })();

  function summarize(entry) {
    const items = Array.isArray(entry?.slot?.items) ? entry.slot.items : [];
    const texts = items.filter((it) => it?.kind === "text").map((it) => String(it.text || ""));
    const files = items.filter((it) => it?.kind === "file");
    const images = items.filter((it) => it?.kind === "image");
    if (files.length + images.length === 0) {
      return { main: texts.join(" ").replace(/\s+/g, " ").trim() || "（空）" };
    }
    if (images.length === 1 && files.length === 0) return { main: "图片" };
    if (files.length === 1 && files[0]?.name) return { main: String(files[0].name) };
    if (texts.length > 0) return { main: `${images.length + files.length} 个文件 + 文本` };
    return { main: `${images.length + files.length} 个文件` };
  }

  function timeOf(entry) {
    const ts = entry?.slot?.ts;
    if (!ts) return "";
    const d = new Date(ts);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    return sameDay ? d.toLocaleTimeString() : d.toLocaleString();
  }

  function render() {
    const q = searchEl.value.trim().toLowerCase();
    filtered = entries.filter((e) => {
      if (!q) return true;
      const s = JSON.stringify(e?.slot?.items || "");
      return s.toLowerCase().includes(q);
    });
    if (cursor >= filtered.length) cursor = Math.max(0, filtered.length - 1);
    listEl.innerHTML = "";
    if (filtered.length === 0) {
      const div = document.createElement("div");
      div.className = "empty";
      div.textContent = loading && entries.length === 0 ? "加载中…" : entries.length === 0 ? "暂无历史（server 环 20 条）" : "无匹配条目";
      listEl.appendChild(div);
      return;
    }
    filtered.forEach((entry, i) => {
      const { main } = summarize(entry);
      const div = document.createElement("div");
      div.className = "entry" + (i === cursor ? " sel" : "");
      const mainEl = document.createElement("div");
      mainEl.className = "main";
      mainEl.textContent = main;
      const metaEl = document.createElement("div");
      metaEl.className = "meta";
      metaEl.textContent = timeOf(entry);
      div.appendChild(mainEl);
      div.appendChild(metaEl);
      div.onclick = () => pick(entry);
      div.onmousemove = () => {
        if (cursor !== i) { cursor = i; paint(); }
      };
      listEl.appendChild(div);
    });
    listEl.children[cursor]?.scrollIntoView({ block: "nearest" });
  }

  function paint() {
    [...listEl.children].forEach((el, i) => el.classList.toggle("sel", i === cursor));
    listEl.children[cursor]?.scrollIntoView({ block: "nearest" });
  }

  async function pick(entry) {
    if (!entry) return;
    try { await window.gotifyAPI?.replayClipboardHistory?.(entry); } catch {}
    window.close();
  }

  searchEl.addEventListener("input", render);
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { ev.preventDefault(); window.close(); return; }
    if (ev.key === "ArrowDown") { ev.preventDefault(); if (cursor < filtered.length - 1) { cursor++; paint(); } return; }
    if (ev.key === "ArrowUp") { ev.preventDefault(); if (cursor > 0) { cursor--; paint(); } return; }
    if (ev.key === "Enter") { ev.preventDefault(); pick(filtered[cursor]); return; }
    // 其余按键回流搜索框
    if (document.activeElement !== searchEl) searchEl.focus();
  });

  (async () => {
    const res = await window.gotifyAPI?.getClipboardHistory?.();
    entries = Array.isArray(res?.entries) ? res.entries : [];
    loading = false;
    render();
  })();
</script>
</body>
</html>
