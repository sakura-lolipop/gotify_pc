name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # lockfile 被禁脚本配置污染过(hasInstallScript:false),npm ci 会跳过
      # electron 的 postinstall → dist 无二进制 → builder rename electron.exe
      # 失败。install.js 幂等(已下载则秒过),显式补一步兜底。
      - name: Ensure electron binary
        run: node node_modules/electron/install.js

      - name: Build Windows installer
        run: npm run build:win:ci

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          generate_release_notes: true
